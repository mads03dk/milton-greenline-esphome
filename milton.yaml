# ============================================================================
# KOMPLET REGISTERTABEL - KORRIGEREDE ADRESSER OG ENHEDER
# ============================================================================
# Adressen er Modbus-registerets 0-baserede decimaladresse.
# Alle registre læses med FC03: holding, slave 1, 19200 baud, 8N1.
# Type angiver fortolkning: U16 er unsigned, S16 er signed. Råsensorer bruger U_WORD.
# Faktor omregner registerværdien til den angivne enhed.
# Betjening viser, hvad denne konfiguration eksponerer. Det bekræfter ikke skriverettigheder.
# En streg betyder kun, at værdien ikke kan skrives fra denne konfiguration.
# Spørgsmålstegn markerer en uafklaret fortolkning eller enhed.
# Faktoren 0.1 for tryk og strøm er bekræftet på det testede anlæg.
# Versionsnumre og tidskoder afkodes ikke og har ingen fysisk enhed.
# Temperaturværdien -990 (U16=64546) vises som NAN i temperatursensorerne.
# Råsensorerne bevarer sentinelværdier og specialkoder, herunder 65535 og 49200.
# Aktuel Ta, TR, TV2, pumpehastigheder og alarmer har ingen verificeret adresse.
# Navnene 1h, 4h og 24h for udetemperaturernes middelværdier følger kildetabellen.
# De præcise beregningsvinduer er ikke verificeret uafhængigt.
#
# Adr. | Beskrivelse | Type | Faktor | Enhed | Betjening | Bemærkning
# 0 | Varmepumpe tilstand | U16 | 1 | — | S11 switch | 0/1 ifølge tabel; kun tilstand 1 er observeret i ny log
# 1 | Softwareversion lav blok | U16 | 1 | versionskode | - | Ingen dokumenteret afkodning til versionsstreng
# 2 | Databaseversion lav blok | U16 | 1 | versionskode | - | Ingen dokumenteret afkodning til versionsstreng
