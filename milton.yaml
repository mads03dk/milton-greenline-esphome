# Ikke tilføjet uden registerdokumentation:
# - Ta (aktuel udetemperatur), TR (rumtemperatur), TV2.
# - Pumpehastighed, P1/P2, varme-/køletilladelser, ECO-funktion og alarmer.
# Modbus-adresserne 511-513 er ikke identificeret.
# Navngiv dem ikke TV2, TR eller Ta uden først at verificere dem.
# Effekt og energi er estimater fra U*I med effektfaktor 1; aktiv effekt og COP måles ikke.
# -990 filtreres kun i fysiske temperatursensorer. Alle rådata bevares.
# 65535/49200 i tidsregistre afkodes IKKE som tid eller fejl uden dokumentation.

# ============================================================================
# S1 og S11: 0 = fra, 1 = til
switch:
  - platform: modbus_controller
    modbus_controller_id: milton
    name: Milton Varmekurve VK1
    id: milton_heating_curve_enable
    address: 30
    register_type: holding
    bitmask: 1
    restore_mode: DISABLED
    use_write_multiple: false
    entity_category: config
  - platform: modbus_controller
    modbus_controller_id: milton
    name: Milton Varmepumpe til fra
    id: milton_heatpump_enable
    address: 0
    register_type: holding
    bitmask: 1
    restore_mode: DISABLED
    use_write_multiple: false
    entity_category: config

# ============================================================================
# T1/T2/T3/K1: hele grader; manuelt valgte betjeningsgraenser
number:
  - platform: modbus_controller
    modbus_controller_id: milton
    name: Milton Sætpunkt brugsvand
    id: milton_dhw_setpoint
    address: 64
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: °C
    min_value: 40
    max_value: 60
    step: 1
    mode: box
    entity_category: config
    use_write_multiple: false
    write_lambda: |-
      if (!std::isfinite(x) || x < 40.0f || x > 60.0f || std::floor(x) != x) {
        ESP_LOGW("milton_control", "Afviser ugyldigt saetpunkt: %.2f", x);
