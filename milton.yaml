# Betjeningsgrænser valgt til denne konfiguration; de er ikke fabrikantens grænser:
# T1, R064 brugsvand: 40-60 °C i trin på 1 °C. T3, R074 genopvarmning: samme grænser.
# T2, R044 fast varme: 20-45 °C i trin på 1 °C.
# K1, R036-R040 vandpunkter 1-5: 20-45 °C hver i trin på 1 °C.
# K1-udepunkterne R031-R035 er kun læsbare.
# Test først ved at ændre én værdi med 1 °C. Kontrollér panelet og næste råaflæsning,
# og gendan derefter den ønskede værdi. Test hovedafbryderen sidst; undgå hurtige skift.
# S11 sender en stopkommando til styringen; den afbryder ikke netforsyningen.
# Få producenten til at bekræfte S11-adfærd ved stop, start, frostsikring og pumpestyring.
