# ============================================================================
# MILTON GREENLINE - OVERVÅGNING + VALGTE BETJENINGSFUNKTIONER
# ============================================================================
#
# LAVET AF: Mads03DK
# GitHub: https://github.com/Mads03DK/esphome-milton-greenline
#
# Slave 1, holding-registers.
# Læse-/skriverettigheder og grænser kan variere mellem modeller/firmware.
# Dette er et uofficielt community-projekt, ikke en fabrikantintegration.
# Kun S1/S11/T1/T2/T3/K1 er gjort skrivbare.
# Talgrænserne nedenfor er VALGTE HA-betjeningsgrænser, ikke fabrikantens grænser.
# 40..60 °C brugsvand/genopvarmning; 20..45 °C varme/kurve; trin 1 °C.
# 45 °C følger den senest aflæste maksimale fremløbsgrænse, men er ikke en
# dynamisk spærring: hvis anlægsgrænser ændres, skal betjeningsgrænser revurderes.
# Varmesætpunkt T2 bruges ved deaktiveret varmekurve. K1 retter kun vandpunkter.
# Råsensorer bevares også for skrivbare registre, så readback kan kontrolleres.
# De forskellige entity-typer kan derfor læse samme register; det er bevidst.
# Standalone config: netværk, krypteret API og OTA bruger lokale secrets.yaml.
# ============================================================================

substitutions:
  devicename: "miltongreenline"
  milton_pressure_scale: "0.1"
  milton_current_scale: "0.1"

esphome:
  name: ${devicename}
  friendly_name: Milton Greenline-varmepumpe

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Seriel logger er deaktiveret; logs er tilgængelige via API/netværk.
logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  - id: milton_rs485_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    flow_control_pin: GPIO21
    baud_rate: 19200
    data_bits: 8
    stop_bits: 1
    parity: NONE
    # Fejlsøgning: sæt logger.level til DEBUG og fjern # fra blokken nedenfor.
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   after:
    #     timeout: 50ms
    #   sequence:
    #     - lambda: UARTDebug::log_hex(direction, bytes, ' ');

modbus:
  - id: milton_modbus
    uart_id: milton_rs485_uart
    send_wait_time: 1000ms

modbus_controller:
  - id: milton
    address: 0x01
    modbus_id: milton_modbus
    update_interval: 60s
    max_cmd_retries: 3

sensor:
  - platform: modbus_controller
    modbus_controller_id: milton
    name: Milton R000 rå - Varmepumpe tilstand
    id: milton_raw_id_1
    address: 0
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    on_value:
    - component.update: milton_heatpump_enable_state
  - platform: modbus_controller
    modbus_controller_id: milton
    name: Milton R001 rå - Softwareversion lav blok
    id: milton_raw_id_2
    address: 1
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
