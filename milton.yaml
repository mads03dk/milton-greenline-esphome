  - platform: modbus_controller
    modbus_controller_id: milton
    name: Milton R026 rå - Stopdifferens varme og koeling
    id: milton_raw_id_27
    address: 26
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    on_value:
    - component.update: milton_setting_id_27
  - platform: template
    name: Milton Stopdifferens varme og koeling (læst indstilling)
    id: milton_setting_id_27
    unit_of_measurement: °C
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (!id(milton_raw_id_27).has_state() || !std::isfinite(id(milton_raw_id_27).state)) return NAN;
      return (int16_t) (uint16_t) id(milton_raw_id_27).state;
